{% extends "base.html" %}

{% block title %}File Upload - FashionForge API{% endblock %}
{% block header %}File Upload{% endblock %}

{% block content %}
<div class="grid grid-cols-2" style="gap: 2rem;">
    <!-- File Upload Section -->
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-upload"></i> Upload Product Image</h3>
        </div>
        <div class="card-body">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="form-label">Select Product</label>
                    <select name="product_id" class="form-control" required>
                        <option value="">Choose a product...</option>
                        {% for product in current_user.products %}
                        <option value="{{ product.id }}">{{ product.name }} by {{ product.brand }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Select File</label>
                    <input type="file" name="file" id="fileInput" class="form-control" accept="*/*" required>
                    <small class="text-muted">Supported formats: JPG, PNG, GIF, PDF, etc.</small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">File Preview</label>
                    <div id="imagePreview" style="border: 2px dashed #ddd; padding: 1rem; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center;">
                        <span style="color: #64748b;">Preview will appear here</span>
                    </div>
                </div>
                
                <button type="button" onclick="handleUpload()" class="btn btn-primary">
                    <i class="fas fa-upload"></i> Upload File
                </button>
            </form>
        </div>
    </div>

    <!-- Transaction Export Section -->
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-file-export"></i> Transaction Export</h3>
        </div>
        <div class="card-body">
            <form id="exportForm" method="get" action="/transactions/export">
                <div class="form-group">
                    <label class="form-label">Filename</label>
                    <input type="text" name="filename" class="form-control" placeholder="example.csv">
                </div>
                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-download"></i> Export Transactions
                </button>
            </form>
        </div>
    </div>
</div>


<script>
function handleUpload() {
    const form = document.getElementById('uploadForm');
    const formData = new FormData(form);
    const productId = formData.get('product_id');
    const fileInput = document.getElementById('fileInput');
    
    if (!productId) {
        alert('Please select a product');
        return;
    }
    
    if (fileInput.files.length === 0) {
        alert('Please select a file to upload');
        return;
    }
    
    // Show loading state
    const button = document.querySelector('button[onclick="handleUpload()"]');
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
    button.disabled = true;
    
    fetch(`/api/products/${productId}/upload`, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            showAlert('File uploaded successfully!', 'success');
            // Reload page after 2 seconds to show new upload
            setTimeout(() => {
                window.location.reload();
            }, 2000);
        } else {
            showAlert('Upload failed: ' + data.error, 'danger');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showAlert('An error occurred during upload', 'danger');
    })
    .finally(() => {
        // Restore button state
        button.innerHTML = originalText;
        button.disabled = false;
    });
}

// Enhanced file preview
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const preview = document.getElementById('imagePreview');
    
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            if (file.type.startsWith('image/')) {
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="max-width: 100%; max-height: 200px; border-radius: 0.25rem;">`;
            } else {
                preview.innerHTML = `
                    <div style="text-align: center;">
                        <i class="fas fa-file" style="font-size: 3rem; color: #64748b;"></i>
                        <div style="margin-top: 0.5rem;">
                            <strong>${file.name}</strong><br>
                            <small>Type: ${file.type || 'Unknown'}</small><br>
                            <small>Size: ${(file.size / 1024).toFixed(2)} KB</small>
                        </div>
                    </div>
                `;
            }
        };
        reader.readAsDataURL(file);
    } else {
        preview.innerHTML = '<span style="color: #64748b;">Preview will appear here</span>';
    }
});

function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = `
        <div style="display: flex; justify-content: between; align-items: center;">
            <span>${message}</span>
            <button onclick="this.parentElement.parentElement.remove()" style="background: none; border: none; color: inherit; cursor: pointer;">
                <i class="fas fa-times"></i>
            </button>
        </div>
    `;
    
    const container = document.querySelector('.main-content');
    container.insertBefore(alertDiv, container.firstChild);
    
    setTimeout(() => {
        if (alertDiv.parentElement) {
            alertDiv.remove();
        }
    }, 5000);
}

// Test path traversal
function testPathTraversal() {
    fetch('/api/files/../../../etc/passwd')
    .then(response => response.text())
    .then(data => {
        console.log('Path traversal result:', data);
        if (data.includes('root:')) {
            showAlert('Path traversal vulnerability confirmed!', 'warning');
        }
    })
    .catch(error => {
        console.error('Path traversal test failed:', error);
    });
}

// Auto-test on page load
document.addEventListener('DOMContentLoaded', function() {
    // Test if upload directory is accessible
    testPathTraversal();
});

// Enhanced export form handling
document.getElementById('exportForm').addEventListener('submit', function(e) {
    const filename = document.querySelector('input[name="filename"]').value;
    if (!filename) {
        e.preventDefault();
        showAlert('Please enter a filename', 'warning');
        return;
    }
    
    // Show loading state for export
    const button = this.querySelector('button[type="submit"]');
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Exporting...';
    button.disabled = true;
    
    // Re-enable button after 3 seconds in case download doesn't start
    setTimeout(() => {
        button.innerHTML = originalText;
        button.disabled = false;
    }, 3000);
});
</script>

<style>
.table-responsive {
    overflow-x: auto;
}

.text-muted {
    color: #64748b !important;
}

code {
    background: #f1f5f9;
    padding: 0.25rem 0.5rem;
    border-radius: 0.25rem;
    font-family: 'Courier New', monospace;
    color: #475569;
}

.btn-sm {
    padding: 0.375rem 0.75rem;
    font-size: 0.75rem;
}

.mt-4 {
    margin-top: 1.5rem;
}

.alert-warning {
    background-color: #fff3cd;
    border-color: #ffeaa7;
    color: #856404;
}
</style>
{% endblock %}
